<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DIP Code Generator</title><link rel="stylesheet" href="style.css"></head><body>
<header><h1>مولّد أكواد معالجة الصور <span class="en">DIP Code Generator</span></h1><small>يولّد كود Python فقط، لا يعالج الصور داخل المتصفح. المحاضرات 2–6</small></header>
<div class="layout"><aside id="side"></aside><main>
<section class="card"><h2>1. الصورة</h2><div class="row"><label>المسار<input id="path" value="aa.jpg" dir="ltr"></label><label>flag<select id="flag"><option value="1">1 ملونة</option><option value="0">0 رمادية</option><option value="-1">-1 كما هي</option></select></label></div></section>
<section class="card"><h2>2. اختيار العملية</h2><div class="row"><label>التصنيف<select id="cat"></select></label><label>العملية<select id="op"></select></label></div><div id="info" class="muted"></div><div id="form" class="row"></div><div id="err" class="err"></div><button id="add" class="pri">إضافة إلى القائمة</button> <button id="cancel" hidden>إلغاء التعديل</button></section>
<section class="card"><h2>3. طلب بلغة طبيعية</h2><textarea id="nl" rows="2" placeholder="مثال: حول الصورة إلى Grayscale ثم صغّرها بنسبة 50% ثم دوّرها 90 درجة"></textarea><button id="parse">تحليل الطلب</button><div id="nlout"></div></section>
<section class="card"><h2>4. قائمة العمليات (Pipeline)</h2><ol id="pipe"></ol><div class="row"><label><input type="checkbox" id="show" checked> عرض النتيجة</label><select id="backend"><option value="cv2">cv2.imshow</option><option value="plt">matplotlib</option></select><label><input type="checkbox" id="save"> حفظ النتيجة</label><input id="out" value="result.png" dir="ltr"><button id="clear">مسح الكل</button></div><button id="gen" class="pri">Generate Python Code</button></section>
<section class="card" id="res" hidden><div class="row"><h2>الكود</h2><input id="fname" value="pipeline.py" dir="ltr"><button id="copy">Copy Code</button><button id="dl">Download Python File</button></div><div id="msgs"></div><pre id="code" dir="ltr"></pre><h3>شرح سطراً بسطر</h3><table id="lines"></table><h3>شرح المعاملات</h3><div id="pdoc"></div></section>
</main></div><script src="operations.js"></script><script src="script.js"></script></body></html>
